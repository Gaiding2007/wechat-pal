<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141614" media="(prefers-color-scheme: dark)">
<title>调试台 · 微信聊天伴侣</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
  .debug-wrap { max-width: 1400px; margin: 0 auto; padding: 24px 32px 60px; }
  .debug-head { display:flex; align-items:center; gap:12px; margin-bottom: 20px; }
  .debug-head h1 { font-size: 20px; font-weight: 600; }
  .debug-head .back { color: var(--muted); font-size: 13px; text-decoration:none; }
  .debug-grid { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  .debug-card { background: var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px; }
  .debug-card h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 10px; letter-spacing:.04em; }
  pre { margin:0; padding:12px; border-radius:10px; background: var(--surface-2); border:1px solid var(--line); font-size:12px; line-height:1.6; overflow:auto; max-height: 420px; white-space: pre-wrap; word-break: break-word; }
  textarea { width:100%; min-height: 320px; border:1px solid var(--line); border-radius:12px; background: var(--surface-2); padding:12px; font-size:12.5px; line-height:1.7; resize: vertical; color: var(--text); }
  .debug-actions { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .debug-actions .hint { font-size:12px; color:var(--faint); }
  .kv { font-size:13px; line-height: 2; }
  .kv b { font-weight:600; }
  @media (max-width: 820px) { .debug-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main class="debug-wrap">
  <header class="debug-head">
    <a class="back" href="/">← 返回聊天</a>
    <h1>调试台</h1>
    <span class="tag" id="mockTag">读取中…</span>
  </header>

  <div class="debug-grid">
    <section class="debug-card">
      <h2>运行状态</h2>
      <div class="kv" id="statusBox">读取中…</div>
    </section>
    <section class="debug-card">
      <h2>网关 / 会话</h2>
      <pre id="gatewayBox">读取中…</pre>
    </section>
    <section class="debug-card" style="grid-column:1 / -1">
      <h2>这次回复实际收到的 system prompt</h2>
      <div class="debug-actions">
        <button class="btn primary" id="btnPrompt" type="button">生成 prompt</button>
        <label class="switch-row compact"><input type="checkbox" id="groupMode"><span>按群聊模式</span></label>
        <span class="hint">用于排查「为什么它这么说话」，只在本机显示。</span>
      </div>
      <textarea id="promptBox" readonly placeholder="点「生成 prompt」查看。"></textarea>
    </section>
    <section class="debug-card" style="grid-column:1 / -1">
      <h2>原始 JSON</h2>
      <pre id="rawBox">读取中…</pre>
    </section>
  </div>
</main>
<script>
(() => {
  const $ = (sel) => document.querySelector(sel);
  const api = async (url, options = {}) => {
    const res = await fetch(url, options);
    return res.json();
  };

  async function refresh() {
    try {
      const data = await api('/api/debug/state');
      const rt = data.runtime || {};
      $('#mockTag').textContent = rt.mock ? '演示模式' : `${rt.providerLabel || rt.provider} · ${rt.model}`;
      $('#statusBox').innerHTML = `
        <div><b>人设</b> ${data.persona || '-'}</div>
        <div><b>模型</b> ${rt.providerLabel || '-'} / ${rt.model || '-'}</div>
        <div><b>Key</b> ${rt.hasKey ? '已配置' : '未配置（演示模式）'}</div>
        <div><b>会话</b> ${data.sessions?.sessions ?? '-'} 个，消息 ${data.sessions?.messages ?? '-'} 条</div>
        <div><b>桥接</b> ${data.gateway?.enabled ? (data.gateway.online ? '在线' : '已启用，等待桥接') : '未启用'}</div>`;
      $('#gatewayBox').textContent = JSON.stringify(data.gateway, null, 2);
      $('#rawBox').textContent = JSON.stringify(data, null, 2);
    } catch (err) {
      $('#rawBox').textContent = String(err);
    }
  }

  async function makePrompt() {
    $('#btnPrompt').disabled = true;
    try {
      const data = await api('/api/debug/prompt', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ group: $('#groupMode').checked }),
      });
      $('#promptBox').value = data.system || '';
    } catch (err) {
      $('#promptBox').value = String(err);
    } finally {
      $('#btnPrompt').disabled = false;
    }
  }

  $('#btnPrompt').addEventListener('click', makePrompt);
  refresh();
  setInterval(refresh, 5000);
})();
</script>
</body>
</html>
